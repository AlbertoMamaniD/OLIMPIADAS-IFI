<div id="bbv-app-root"></div>

<script>
(function () {
  const root = document.getElementById('bbv-app-root');

  // Se usa desde el atributo onchange del <select> de "otra empresa": así la elección
  // queda guardada en el estado de la app apenas se elige, sin depender de leer el DOM
  // más tarde (evita que un redibujado de por medio la resetee al valor por defecto).
  window.__bbvSetOtherCompany = function (value) {
    if (app.modal && app.modal.type === 'other-company') app.modal.otherCompanyId = value;
  };

  // ================= MOTOR DE REGLAS (gameEngine.js embebido) =================
// ============================================================
// JUEGO DE LA BOLSA — Motor de reglas (Sesión 1)
// Lógica pura, sin UI. Todo el estado es un objeto plano (serializable a JSON),
// pensado para vivir luego en window.storage (shared) y sincronizarse por polling.
// ============================================================

const PRICE_FLOOR = 10;
const PRICE_CEIL = 250;
const TURN_SECONDS = 120; // valor por defecto si no se especifica al crear la partida
const TURN_SECONDS_OPTIONS = [30, 60, 90, 120]; // duraciones de turno que el broker puede elegir
const AUCTION_LOT_SIZE = 30;
const AUCTION_MAX_CONTRIBUTION_PER_TEAM = 5;
const CRISIS_BUYBACK_PRICE = 20;
const MAX_SHARES_PER_COMPANY = 260; // total emitido; empieza todo en inventario del broker

// ---------- Definición de tarjetas ----------
// Cada tarjeta describe su efecto de forma declarativa.
// "target" = la empresa de la tarjeta. "other" = otra empresa elegida por el equipo (si aplica).
const CARD_DEFS = {
  '100_10': {
    label: '100 / 10',
    needsOtherCompany: false,
    apply: (state, targetId) => {
      applyDelta(state, targetId, +100);
      allCompaniesExcept(state, targetId).forEach(c => applyDelta(state, c.id, -10));
    },
  },
  '20_50': {
    label: '20 / 50',
    needsOtherCompany: false,
    apply: (state, targetId) => {
      applyDelta(state, targetId, -50);
      allCompaniesExcept(state, targetId).forEach(c => applyDelta(state, c.id, +20));
    },
  },
  '80_40': {
    label: '80 / 40',
    needsOtherCompany: true,
    apply: (state, targetId, otherId) => {
      applyDelta(state, targetId, +80);
      applyDelta(state, otherId, -40);
    },
  },
  '2x': {
    label: '2x',
    needsOtherCompany: true,
    apply: (state, targetId, otherId) => {
      applyMultiplier(state, targetId, 2);
      applyMultiplier(state, otherId, 0.5);
    },
  },
  'half_2x': {
    label: '1/2x',
    needsOtherCompany: true,
    apply: (state, targetId, otherId) => {
      applyMultiplier(state, targetId, 0.5);
      applyMultiplier(state, otherId, 2);
    },
  },
  'auction': {
    label: 'Subasta',
    needsOtherCompany: false,
    apply: (state, targetId) => {
      startAuction(state, targetId);
    },
  },
};

// ---------- Helpers de precio ----------
function getCompany(state, companyId) {
  const c = state.companies.find(c => c.id === companyId);
  if (!c) throw new Error(`Empresa no encontrada: ${companyId}`);
  return c;
}

function allCompaniesExcept(state, excludeId) {
  return state.companies.filter(c => c.id !== excludeId);
}

function clampPrice(price) {
  return Math.max(PRICE_FLOOR, Math.min(PRICE_CEIL, price));
}

// Aplica un delta absoluto de precio, y encola eventos de piso/techo si corresponde.
function applyDelta(state, companyId, delta) {
  const company = getCompany(state, companyId);
  company.price = company.price + delta;
  checkPriceEvents(state, company);
}

function applyMultiplier(state, companyId, factor) {
  const company = getCompany(state, companyId);
  company.price = Math.round(company.price * factor);
  checkPriceEvents(state, company);
}

// Detecta techo (dividendo, automático) y piso (crisis, requiere decisión).
function checkPriceEvents(state, company) {
  company.lastPriceEvent = null; // 'dividend' | 'crisis' | null, se recalcula en cada cambio de precio
  if (company.price > PRICE_CEIL) {
    const excess = company.price - PRICE_CEIL;
    payDividend(state, company, excess);
    company.price = PRICE_CEIL;
    company.lastPriceEvent = 'dividend';
  }
  if (company.price <= PRICE_FLOOR) {
    company.price = PRICE_FLOOR;
    triggerCrisis(state, company);
    company.lastPriceEvent = 'crisis';
  }
  company.priceHistory = company.priceHistory || [];
  company.priceHistory.push(company.price);
}

// Dividendo: automático, se paga a cada accionista por acción poseída.
function payDividend(state, company, excessPerShare) {
  state.teams.forEach(team => {
    const qty = team.holdings[company.id] || 0;
    if (qty > 0) {
      const payout = qty * excessPerShare;
      team.cash += payout;
      logEvent(state, `Dividendo: ${team.name} recibe ${payout} por ${qty} acciones de ${company.name}`);
    }
  });
}

// Crisis: no es automático del todo — cada accionista debe decidir.
// Se registra como decisión pendiente; el motor no avanza el turno hasta resolverlas.
function triggerCrisis(state, company) {
  const shareholders = state.teams.filter(t => (t.holdings[company.id] || 0) > 0 && !t.eliminated);
  if (shareholders.length === 0) return;
  state.pendingDecisions = state.pendingDecisions || [];
  shareholders.forEach(team => {
    state.pendingDecisions.push({
      type: 'crisis',
      companyId: company.id,
      teamId: team.id,
      resolved: false,
    });
  });
  state.paused = true; // el reloj se detiene durante una crisis (regla del manual)
  logEvent(state, `Crisis en ${company.name}: precio tocó el piso (${PRICE_FLOOR})`);
}

// El equipo decide: 'keep' (paga 20/acción) o 'return' (devuelve todas al broker).
function resolveCrisisDecision(state, teamId, companyId, decision) {
  const pending = state.pendingDecisions?.find(
    d => d.type === 'crisis' && d.teamId === teamId && d.companyId === companyId && !d.resolved
  );
  if (!pending) throw new Error('No hay decisión de crisis pendiente para ese equipo/empresa');

  const team = getTeam(state, teamId);
  const qty = team.holdings[companyId] || 0;

  if (decision === 'keep') {
    const cost = qty * CRISIS_BUYBACK_PRICE;
    if (team.cash < cost) throw new Error('Fondos insuficientes para conservar las acciones');
    team.cash -= cost;
    logEvent(state, `${team.name} conserva ${qty} acciones pagando ${cost}`);
  } else if (decision === 'return') {
    team.holdings[companyId] = 0;
    getCompany(state, companyId).brokerShares += qty;
    logEvent(state, `${team.name} devuelve ${qty} acciones al broker`);
  } else {
    throw new Error("decision debe ser 'keep' o 'return'");
  }
  pending.resolved = true;
  checkElimination(state, team);
  if (!hasPendingDecisions(state) && !state.auction) {
    state.paused = false;
    state.currentTurn.turnStartedAt = Date.now(); // reanuda el reloj desde cero
  }
}

function hasPendingDecisions(state) {
  return (state.pendingDecisions || []).some(d => !d.resolved);
}

// ---------- Equipos / compra-venta ----------
function getTeam(state, teamId) {
  const t = state.teams.find(t => t.id === teamId);
  if (!t) throw new Error(`Equipo no encontrado: ${teamId}`);
  return t;
}

function currentTeam(state) {
  return getTeam(state, state.currentTurn.teamId);
}

// phase: 'before' | 'after'. Restringe recomprar/vender la misma empresa operada en "before".
function trade(state, teamId, companyId, qty, side, phase) {
  if (state.currentTurn.teamId !== teamId) throw new Error('No es el turno de este equipo');
  if (state.currentTurn.phase !== phase) throw new Error(`No se puede operar en fase ${phase} ahora mismo`);
  if (phase === 'after' && state.currentTurn.operatedCompanyBefore === companyId) {
    throw new Error('No puedes volver a operar la misma empresa que operaste antes de la tarjeta');
  }
  if (state.currentTurn.isLastTurn && side === 'buy') {
    throw new Error('Último turno del juego: solo se puede vender');
  }

  const team = getTeam(state, teamId);
  const company = getCompany(state, companyId);

  if (side === 'buy') {
    const cost = qty * company.price;
    if (team.cash < cost) throw new Error('Fondos insuficientes');
    if (company.brokerShares < qty) throw new Error('El broker no tiene suficientes acciones disponibles');
    team.cash -= cost;
    company.brokerShares -= qty;
    team.holdings[companyId] = (team.holdings[companyId] || 0) + qty;
    logEvent(state, `${team.name} compra ${qty} de ${company.name} a ${company.price}`);
  } else if (side === 'sell') {
    const held = team.holdings[companyId] || 0;
    if (held < qty) throw new Error('No tienes suficientes acciones para vender');
    team.holdings[companyId] = held - qty;
    company.brokerShares += qty;
    team.cash += qty * company.price;
    logEvent(state, `${team.name} vende ${qty} de ${company.name} a ${company.price}`);
  } else {
    throw new Error("side debe ser 'buy' o 'sell'");
  }

  if (phase === 'before') {
    state.currentTurn.operatedCompanyBefore = companyId;
  }
}

function sellDuringAuction(state, teamId, companyId, qty) {
  if (!state.auction) throw new Error('Solo se puede vender libremente mientras hay una subasta activa');
  const team = getTeam(state, teamId);
  const company = getCompany(state, companyId);
  const held = team.holdings[companyId] || 0;
  if (held < qty) throw new Error('No tienes suficientes acciones para vender');
  team.holdings[companyId] = held - qty;
  company.brokerShares += qty;
  team.cash += qty * company.price;
  logEvent(state, `${team.name} vende ${qty} de ${company.name} a ${company.price} (liquidez para la subasta)`);
}

// ---------- Tarjetas ----------
// Cada carta en mano ya trae su empresa fija de efecto (targetCompanyId), como una
// carta física impresa. Si la carta lo requiere, el equipo elige "otra empresa" recién
// al jugarla (ej. 80/40, 2x, 1/2x muestran un menú para elegir la afectada).
let _cardInstanceCounter = 0;
function makeCardInstance(cardId, targetCompanyId) {
  _cardInstanceCounter += 1;
  return { instanceId: `card_${_cardInstanceCounter}`, cardId, targetCompanyId };
}

function playCard(state, teamId, instanceId, otherCompanyId) {
  if (state.currentTurn.teamId !== teamId) throw new Error('No es el turno de este equipo');
  if (state.currentTurn.cardPlayed) throw new Error('Ya se jugó una tarjeta este turno');

  const team = getTeam(state, teamId);
  const idxInHand = team.hand.findIndex(c => c.instanceId === instanceId);
  if (idxInHand === -1) throw new Error('El equipo no tiene esa tarjeta en mano');
  const instance = team.hand[idxInHand];

  const def = CARD_DEFS[instance.cardId];
  if (!def) throw new Error(`Tarjeta desconocida: ${instance.cardId}`);
  if (def.needsOtherCompany && !otherCompanyId) {
    throw new Error('Esta tarjeta requiere elegir otra empresa afectada');
  }
  if (otherCompanyId === instance.targetCompanyId) {
    throw new Error('La otra empresa debe ser distinta de la empresa de la tarjeta');
  }

  // Tarjeta jugada no se cambia: se retira de la mano y se aplica de inmediato.
  team.hand.splice(idxInHand, 1);
  team.played.push(instance);

  def.apply(state, instance.targetCompanyId, otherCompanyId);

  state.currentTurn.cardPlayed = { cardId: instance.cardId, targetCompanyId: instance.targetCompanyId, otherCompanyId };
  state.currentTurn.phase = 'after';
  logEvent(state, `${team.name} juega ${def.label} sobre ${getCompany(state, instance.targetCompanyId).name}`);
}

// ---------- Subasta ----------
// Todos los accionistas de la empresa aportan de forma OBLIGATORIA hasta 5 acciones
// (o todas las que tengan, si tienen menos de 5) apenas se juega la tarjeta de subasta.
// El broker completa el resto del lote desde su inventario.
function startAuction(state, companyId) {
  const company = getCompany(state, companyId);
  const priceAtStart = company.price;
  const shareholders = state.teams.filter(t => (t.holdings[companyId] || 0) > 0 && !t.eliminated);

  const contributions = {};
  shareholders.forEach(team => {
    const held = team.holdings[companyId] || 0;
    const qty = Math.min(held, AUCTION_MAX_CONTRIBUTION_PER_TEAM);
    team.holdings[companyId] = held - qty;
    contributions[team.id] = qty;
  });

  const contributedTotal = Object.values(contributions).reduce((a, b) => a + b, 0);
  const neededFromBroker = AUCTION_LOT_SIZE - contributedTotal;
  const brokerGives = Math.min(neededFromBroker, company.brokerShares);
  company.brokerShares -= brokerGives;

  state.auction = {
    companyId,
    lotSize: AUCTION_LOT_SIZE,
    priceAtStart,
    contributions,
    brokerShares: brokerGives,
    bids: [],
    status: 'bidding',
    initiatorTeamId: state.currentTurn.teamId,
    auctionStartedAt: Date.now(),
  };
  state.paused = true; // el reloj se detiene durante la subasta (regla del manual)
  logEvent(state, `Subasta obligatoria: ${AUCTION_LOT_SIZE} acciones de ${company.name} (aportaron ${contributedTotal}, broker completa ${brokerGives})`);
}

const AUCTION_BID_INCREMENT = 10;
const AUCTION_SECONDS = 30;
function nextAuctionBidAmount(state) {
  const auction = state.auction;
  if (!auction) return null;
  const highest = auction.bids[auction.bids.length - 1];
  return highest ? highest.amountPerShare + AUCTION_BID_INCREMENT : AUCTION_BID_INCREMENT;
}

function placeBid(state, teamId) {
  const auction = state.auction;
  if (!auction || auction.status !== 'bidding') throw new Error('No hay subasta en fase de puja');
  const amountPerShare = nextAuctionBidAmount(state);
  const team = getTeam(state, teamId);
  if (team.cash < amountPerShare * auction.lotSize) throw new Error('Fondos insuficientes para pujar ese monto por el lote completo');
  auction.bids.push({ teamId, amountPerShare });
}

function payAuctionContributors(state, auction) {
  Object.entries(auction.contributions).forEach(([teamId, qty]) => {
    if (qty > 0) {
      const team = getTeam(state, teamId);
      const payout = qty * auction.priceAtStart;
      team.cash += payout;
      logEvent(state, `${team.name} recibe ${payout} por sus ${qty} acciones liquidadas en la subasta`);
    }
  });
}

function closeAuction(state) {
  state.auction = null;
  if (!hasPendingDecisions(state)) {
    state.paused = false;
    state.currentTurn.turnStartedAt = Date.now();
  }
}

// Adjudica la subasta a la puja más alta que AÚN pueda pagarse. Un equipo puede haber vendido
// o gastado efectivo después de pujar; en ese caso se lo descarta (con registro en el log) y se
// pasa a la siguiente mejor puja. Si ninguna puede pagarse, el lote vuelve al broker. Nunca lanza
// error por falta de fondos, para que la subasta siempre pueda cerrarse.
function finalizeAuctionWithWinner(state, auction) {
  const disqualified = new Set();
  for (let i = auction.bids.length - 1; i >= 0; i--) {
    const bid = auction.bids[i];
    if (disqualified.has(bid.teamId)) continue;
    const team = getTeam(state, bid.teamId);
    const totalPaid = bid.amountPerShare * auction.lotSize;
    if (team.cash < totalPaid) {
      disqualified.add(bid.teamId);
      logEvent(state, `${team.name} ya no tiene fondos para su puja de ${bid.amountPerShare}/acción y queda fuera de la subasta`);
      continue;
    }
    team.cash -= totalPaid;
    team.holdings[auction.companyId] = (team.holdings[auction.companyId] || 0) + auction.lotSize;
    payAuctionContributors(state, auction);
    logEvent(state, `Subasta adjudicada a ${team.name} por ${bid.amountPerShare}/acción (total ${totalPaid})`);
    closeAuction(state);
    return;
  }
  // Ninguna puja pudo pagarse: el lote vuelve al inventario del broker.
  const company = getCompany(state, auction.companyId);
  company.brokerShares += auction.lotSize;
  payAuctionContributors(state, auction);
  logEvent(state, `Subasta cerrada: ninguna puja pudo pagarse, el lote vuelve al inventario del broker`);
  closeAuction(state);
}

function resolveAuction(state) {
  const auction = state.auction;
  if (!auction || auction.status !== 'bidding') throw new Error('La subasta no está en fase de puja');
  if (auction.bids.length === 0) throw new Error('No hay pujas para adjudicar');
  finalizeAuctionWithWinner(state, auction);
}

function forceResolveAuctionOnTimeout(state) {
  const auction = state.auction;
  if (!auction) return;
  if (auction.bids.length === 0) {
    const company = getCompany(state, auction.companyId);
    company.brokerShares += auction.lotSize;
    payAuctionContributors(state, auction);
    logEvent(state, `Subasta cerrada sin pujas: el lote vuelve al inventario del broker`);
    closeAuction(state);
  } else {
    finalizeAuctionWithWinner(state, auction);
  }
}

// ---------- Eliminación ----------
function checkElimination(state, team) {
  const totalShares = Object.values(team.holdings).reduce((a, b) => a + b, 0);
  if (team.cash <= 0 && totalShares === 0) {
    team.eliminated = true;
    logEvent(state, `${team.name} queda eliminado (sin dinero ni acciones)`);
  }
}

// ---------- Turnos ----------
function endTurn(state) {
  if (!state.currentTurn.cardPlayed) throw new Error('Debes jugar una tarjeta antes de terminar el turno');
  if (hasPendingDecisions(state)) throw new Error('Hay decisiones de crisis pendientes antes de cerrar el turno');
  if (state.auction) throw new Error('Hay una subasta activa, resuélvela antes de continuar');

  checkElimination(state, currentTeam(state));

  const activeTeams = state.teams.filter(t => !t.eliminated);
  const allHandsEmpty = activeTeams.every(t => t.hand.length === 0);
  if (allHandsEmpty) {
    endGame(state);
    return;
  }

  advanceToNextTeam(state);
}

// Es el último turno de la partida cuando al equipo en turno le queda exactamente 1 tarjeta
// y ningún otro equipo activo tiene tarjetas: al jugarla, todas las manos quedan vacías.
// Se calcula al inicio de cada turno (las manos de los demás no cambian durante él).
function computeIsLastTurn(state, teamId) {
  const team = getTeam(state, teamId);
  if (team.hand.length !== 1) return false;
  return state.teams.every(t => t.id === teamId || t.eliminated || t.hand.length === 0);
}

function advanceToNextTeam(state) {
  const order = state.turnOrder;
  let idx = order.indexOf(state.currentTurn.teamId);
  let nextTeam;
  do {
    idx = (idx + 1) % order.length;
    nextTeam = getTeam(state, order[idx]);
  } while (nextTeam.eliminated || nextTeam.hand.length === 0);

  state.turnNumber += 1;
  state.currentTurn = {
    teamId: nextTeam.id,
    phase: 'before',
    operatedCompanyBefore: null,
    cardPlayed: null,
    timeRemaining: state.turnSeconds ?? TURN_SECONDS,
    turnStartedAt: Date.now(),
    isLastTurn: computeIsLastTurn(state, nextTeam.id),
  };
}

function forceEndTurn(state) {
  // Se usa cuando se acaba el tiempo del turno sin jugar tarjeta, o si el broker salta el turno.
  const team = currentTeam(state);
  if (!state.currentTurn.cardPlayed && team.hand.length > 0) {
    const idx = Math.floor(Math.random() * team.hand.length);
    const discarded = team.hand.splice(idx, 1)[0];
    logEvent(state, `Se acabó el tiempo: se descarta al azar la tarjeta ${CARD_DEFS[discarded.cardId].label} de ${team.name}`);
  } else {
    logEvent(state, `Se fuerza el fin del turno de ${team.name}`);
  }
  checkElimination(state, team);
  const activeTeams = state.teams.filter(t => !t.eliminated);
  const allHandsEmpty = activeTeams.every(t => t.hand.length === 0);
  if (allHandsEmpty) { endGame(state); return; }
  advanceToNextTeam(state);
}

function endGame(state) {
  state.teams.forEach(team => {
    Object.entries(team.holdings).forEach(([companyId, qty]) => {
      const company = getCompany(state, companyId);
      team.cash += qty * company.price;
      team.holdings[companyId] = 0;
    });
  });
  state.gameOver = true;
  const ranking = [...state.teams].sort((a, b) => b.cash - a.cash);
  state.winnerTeamId = ranking[0].id;
  logEvent(state, `Juego terminado. Gana ${ranking[0].name} con ${ranking[0].cash}`);
}

function logEvent(state, text) {
  state.log.push({ turn: state.turnNumber, text });
}

// ---------- Inicialización ----------
// hands: array paralelo a teamNames, cada elemento es una lista de cardIds (ej. ['100_10','2x']).
// El motor le asigna a cada carta una empresa objetivo al azar (como una carta física impresa),
// a menos que se pase explícitamente { cardId, targetCompanyId } para pruebas deterministas.
function initGameState(companies, teamNames, hands, options = {}) {
  const startingCash = options.startingCash ?? 1000;
  const turnSeconds = options.turnSeconds ?? TURN_SECONDS;
  const state = {
    turnSeconds,
    companies: companies.map(c => ({ ...c, brokerShares: MAX_SHARES_PER_COMPANY, priceHistory: [c.price] })),
    teams: teamNames.map((entry, i) => {
      const isObj = typeof entry === 'object' && entry !== null;
      const id = isObj ? entry.id : `team_${i + 1}`;
      const name = isObj ? entry.name : entry;
      return {
        id,
        name,
        cash: startingCash,
        holdings: {},
        hand: hands[i].map(cardEntry => {
          if (typeof cardEntry === 'string') {
            const randomCompany = companies[Math.floor(Math.random() * companies.length)];
            return makeCardInstance(cardEntry, randomCompany.id);
          }
          return makeCardInstance(cardEntry.cardId, cardEntry.targetCompanyId);
        }),
        played: [],
        eliminated: false,
      };
    }),
    turnOrder: teamNames.map((entry, i) => (typeof entry === 'object' && entry !== null) ? entry.id : `team_${i + 1}`),
    turnNumber: 1,
    lastTurnNumber: null, // en desuso: el último turno se detecta con currentTurn.isLastTurn
    currentTurn: null,
    auction: null,
    paused: false,
    manualPause: false,
    manualPauseStartedAt: null,
    pendingDecisions: [],
    gameOver: false,
    log: [],
  };
  state.currentTurn = {
    teamId: state.turnOrder[0],
    phase: 'before',
    operatedCompanyBefore: null,
    cardPlayed: null,
    timeRemaining: turnSeconds,
    turnStartedAt: Date.now(),
    isLastTurn: false,
  };
  state.currentTurn.isLastTurn = computeIsLastTurn(state, state.currentTurn.teamId);
  return state;
}


  // ================= DATOS POR DEFECTO =================
  const DEFAULT_COMPANIES = [
    { id: 'c1', name: 'Empresa 1', ticker: 'E1', color: '#6a5acd', price: 100 },
    { id: 'c2', name: 'Empresa 2', ticker: 'E2', color: '#2a8fbd', price: 100 },
    { id: 'c3', name: 'Empresa 3', ticker: 'E3', color: '#c07a2e', price: 100 },

    { id: 'c5', name: 'Empresa 5', ticker: 'E5', color: '#3f9142', price: 100 },
  ];

  function dealRandomHand(size, allowedIds) {

  const roomKey = (code) => 'room:' + code;

  const CODE_CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  async function generateUniqueCode() {
    for (let attempt = 0; attempt < 6; attempt++) {
      let code = '';
      for (let i = 0; i < 5; i++) code += CODE_CHARS[Math.floor(Math.random() * CODE_CHARS.length)];
      if (!(await getJSON(roomKey(code)))) return code;

  // Guarda lo escrito/marcado en la pantalla de configuración del broker para que un

  function captureSetupDraft() {

    const cards = {};

  // ================= ACCIONES DE LOBBY =================
  async function createRoom(maxTeamsRaw, handSizeRaw, enabledCardIds, turnSecondsRaw) {
    app.error = '';
    let maxTeams = null;
    if (maxTeamsRaw && maxTeamsRaw.trim() !== '') {
      const n = parseInt(maxTeamsRaw, 10);
      if (isNaN(n) || n < 2) { app.error = 'El límite debe ser un número de 2 o más'; render(); return; }
      maxTeams = n;
    }
    let handSize = DEFAULT_HAND_SIZE;
    if (handSizeRaw && handSizeRaw.trim() !== '') {
      const h = parseInt(handSizeRaw, 10);
      if (isNaN(h) || h < 1 || h > 20) { app.error = 'La cantidad de tarjetas debe ser entre 1 y 20'; render(); return; }
      handSize = h;
    }
    let turnSeconds = DEFAULT_TURN_SECONDS;
    const t = parseInt(turnSecondsRaw, 10);
    if (TURN_DURATION_CHOICES.some(opt => opt.seconds === t)) turnSeconds = t;
    if (!enabledCardIds || enabledCardIds.length === 0) {
      app.error = 'Elige al menos un tipo de tarjeta para la partida';
      render();
      return;
    }
    try {
      const code = await generateUniqueCode();
      const room = { code, maxTeams, handSize, turnSeconds, enabledCardIds, started: false, teams: [], createdAt: Date.now() };
      await setJSON(roomKey(code), room);
      app.roomCode = code;
      app.room = room;
      setScreen('broker-waiting');
      startPolling(async () => {

      });

  }

  async function joinRoom(codeRaw, nameRaw) {

    if (code.length < 4) { app.error = 'Ingresa el código completo de la sala'; render(); return; }
    if (!name) { app.error = 'Ingresa el nombre de tu equipo'; render(); return; }

    if (!room) { app.error = 'No existe una sala con ese código'; render(); return; }

    if (room.started) {

      const game = await getJSON(gameKey(code));

      if (!existingTeam) {

  async function startGame() {

    const teamsForEngine = room.teams.map(t => ({ id: t.id, name: t.name }));
    const allowedIds = (room.enabledCardIds && room.enabledCardIds.length) ? room.enabledCardIds : ALL_CARD_IDS;
    const hands = teamsForEngine.map(() => dealRandomHand(room.handSize, allowedIds));
    const game = initGameState(DEFAULT_COMPANIES, teamsForEngine, hands, { startingCash: 1000, turnSeconds: room.turnSeconds ?? DEFAULT_TURN_SECONDS });
    await setJSON(gameKey(room.code), game);
    room.started = true;
    await setJSON(roomKey(room.code), room);
    app.room = room;
    app.game = game;
    render();
  }

  async function loadGameAndSwitch(nextScreen) {
    const g = await getJSON(gameKey(app.roomCode));
    if (g) app.game = g;
    if (app.screen !== nextScreen) {
      stopTimers();
      app.screen = nextScreen;
      if (nextScreen === 'game') { startGamePolling(); startTicker(); }
      else { startBrokerGamePolling(); startBrokerTicker(); }
      render();
    }
  }

  function startBrokerGamePolling() {
    app.pollHandle = setInterval(async () => {
      const g = await getJSON(gameKey(app.roomCode));
      if (g && Date.now() > (app.suppressPollUntil || 0)) { app.game = g; render(); }
    }, 1500);
  }

  // El broker también actúa como respaldo: si el equipo en turno (o el que disparó la
  // subasta) se desconectó, el broker cierra el turno / la subasta pasado un margen de gracia.
  function startBrokerTicker() {
    app.tickHandle = setInterval(() => {
      if (app.screen === 'broker-started' && app.game && !app.game.gameOver) {
        maybeAutoEndTurn();
        maybeAutoResolveAuction();
        render();
      }
    }, 1000);
  }

  async function doTogglePause() {
    try {
      const latest = await getJSON(gameKey(app.roomCode)) || app.game;
      if (!latest.manualPause) {
        latest.manualPause = true;
        latest.manualPauseStartedAt = Date.now();
        logEvent(latest, 'El broker pausó la partida');
      } else {
        const pausedMs = Date.now() - (latest.manualPauseStartedAt || Date.now());
        latest.currentTurn.turnStartedAt = (latest.currentTurn.turnStartedAt || Date.now()) + pausedMs;
        latest.manualPause = false;
        latest.manualPauseStartedAt = null;
        logEvent(latest, 'El broker reanudó la partida');
      }
      app.game = latest;
      markLocalWrite();
      await saveGame();
    } catch (e) { app.error = e.message; }
    render();
  }

  async function doSkipTurn() {

      forceEndTurn(latest);

  function startPolling(fn) {
    stopTimers();
    fn();

  function isUserTyping() {
    const el = document.activeElement;
    return !!(el && root.contains(el) && (el.tagName === 'INPUT' || el.tagName === 'SELECT'));
  }

  function startGamePolling() {
    app.pollHandle = setInterval(async () => {
      const g = await getJSON(gameKey(app.roomCode));
      if (g && Date.now() > (app.suppressPollUntil || 0)) { app.game = g; if (!app.modal && !isUserTyping()) render(); }
    }, 1500);
  }

  // Los cierres automáticos (turno y subasta) no dependen de que haya un modal abierto:
  // solo tocan el estado compartido, no la pantalla.
  function startTicker() {
    app.tickHandle = setInterval(() => {
      if (app.screen === 'game' && app.game && !app.game.gameOver) {
        maybeAutoEndTurn();
        maybeAutoResolveAuction();
        if (!app.modal && !isUserTyping()) render();
      }
    }, 1000);
  }

  // ================= LÓGICA DE JUEGO (usa el motor) =================
  function timeRemainingFor(game) {
    if (game.paused || game.manualPause) return null;
    const elapsed = Math.floor((Date.now() - (game.currentTurn.turnStartedAt || Date.now())) / 1000);
    return Math.max(0, (game.turnSeconds ?? TURN_SECONDS) - elapsed);
  }

  // Segundos transcurridos después de vencido el turno (negativo si aún queda tiempo).
  function secondsPastTurnDeadline(game) {
    const elapsed = Math.floor((Date.now() - (game.currentTurn.turnStartedAt || Date.now())) / 1000);
    return elapsed - (game.turnSeconds ?? TURN_SECONDS);
  }

  async function saveGame() {
    await setJSON(gameKey(app.roomCode), app.game);
  }

  // Cierra el turno cuando se acaba el tiempo. Lo intenta primero el equipo en turno; si no
  // lo logra (desconectado, pestaña dormida), lo intenta el broker y luego cualquier otro equipo.
  // Antes de escribir se relee el estado y se verifica que sea el MISMO turno, para no
  // saltar dos turnos si dos clientes coinciden.
  async function maybeAutoEndTurn() {
    const g = app.game;
    if (!g || g.gameOver || g.paused || g.manualPause || g.auction) return;
    if (app.autoBusyTurn) return;
    const isBroker = app.screen === 'broker-started';
    const isCurrent = g.currentTurn.teamId === app.myTeamId;
    const grace = isCurrent ? TURN_FALLBACK_GRACE.current : (isBroker ? TURN_FALLBACK_GRACE.broker : TURN_FALLBACK_GRACE.team);
    if (secondsPastTurnDeadline(g) < grace) return;
    app.autoBusyTurn = true;
    try {
      const latest = await getJSON(gameKey(app.roomCode));
      if (latest && !latest.gameOver && !latest.paused && !latest.manualPause && !latest.auction &&
          latest.turnNumber === g.turnNumber &&
          latest.currentTurn.teamId === g.currentTurn.teamId &&
          latest.currentTurn.turnStartedAt === g.currentTurn.turnStartedAt &&
          secondsPastTurnDeadline(latest) >= grace) {
        forceEndTurn(latest); // si no jugó tarjeta, esto ya descarta una al azar
        app.game = latest;
        markLocalWrite();
        await saveGame();
      }
    } catch (e) { /* silencioso: es un intento en segundo plano */ }
    finally { app.autoBusyTurn = false; }
  }

  // Cierra la subasta a los 30 s. Primero lo intenta el equipo que la disparó; si no, el
  // broker (3 s después) o cualquier otro equipo (6 s después). Así la subasta nunca queda
  // trabada por un dispositivo desconectado.
  async function maybeAutoResolveAuction() {
    const g = app.game;
    if (!g || !g.auction || app.autoBusyAuction) return;
    const isBroker = app.screen === 'broker-started';
    const isInitiator = g.auction.initiatorTeamId === app.myTeamId;
    const grace = isInitiator ? AUCTION_FALLBACK_GRACE.initiator : (isBroker ? AUCTION_FALLBACK_GRACE.broker : AUCTION_FALLBACK_GRACE.team);
    const elapsed = Math.floor((Date.now() - (g.auction.auctionStartedAt || Date.now())) / 1000);
    if (elapsed < AUCTION_SECONDS + grace) return;
    app.autoBusyAuction = true;
    try {
      const latest = await getJSON(gameKey(app.roomCode));
      if (latest && latest.auction && latest.auction.auctionStartedAt === g.auction.auctionStartedAt) {
        forceResolveAuctionOnTimeout(latest);
        app.game = latest;
        markLocalWrite();
        await saveGame();
      }
    } catch (e) { /* silencioso */ }
    finally { app.autoBusyAuction = false; }
  }

  function markLocalWrite() {
    app.suppressPollUntil = Date.now() + 2200; // da tiempo a que la escritura se propague antes de confiar en el sondeo
  }

  async function doTrade(companyId, side, qty) {
    try {
      const latest = await getJSON(gameKey(app.roomCode)) || app.game;
      if (side === 'sell' && latest.auction) {
        sellDuringAuction(latest, app.myTeamId, companyId, qty);
      } else {
        trade(latest, app.myTeamId, companyId, qty, side, latest.currentTurn.phase);
      }
      app.game = latest;
      markLocalWrite();
      await saveGame();
    } catch (e) { app.error = e.message; }
    app.modal = null;
    render();
  }

          <p class="bbv-section-title">Mercado</p>
          <div class="bbv-company-list">${marketRows}</div>
        </div>
        <div>
          <p class="bbv-section-title">Controles</p>
          <div class="bbv-portfolio" style="margin-bottom:12px;">
            <div class="bbv-inline-row" style="margin-bottom:8px;">
              <button class="bbv-btn-sm" data-action="toggle-pause" ${(canToggleControls || g.manualPause) && !app.actionInFlight ? '' : 'disabled'}>${g.manualPause ? 'Reanudar partida' : 'Pausar partida'}</button>
            </div>
            <div class="bbv-inline-row">
              <button class="bbv-btn-sm alt" data-action="skip-turn" ${canToggleControls && !g.manualPause && !app.actionInFlight ? '' : 'disabled'}>Saltar turno actual</button>
            </div>
            ${!canToggleControls && !g.manualPause ? '<p class="bbv-hint">Hay una subasta o crisis en curso; espera a que se resuelva.</p>' : ''}
          </div>
          ${view_eventLog()}
        </div>
      </div>`;
  }

  // ================= VISTAS: JUEGO =================
  function view_turnBanner() {
    const g = app.game;
    const isMyTurn = g.currentTurn.teamId === app.myTeamId;
    if (g.gameOver) {
      const ranking = [...g.teams].sort((a, b) => b.cash - a.cash);
      return `<div class="bbv-turn-banner"><span>Partida terminada. Gana <strong>${escapeHtml(ranking[0].name)}</strong> con ${formatBs(ranking[0].cash)}.</span></div>`;
    }
    if (g.manualPause) {
      return `<div class="bbv-turn-banner"><span>El broker pausó la partida.</span><span class="bbv-timer paused">Pausado</span></div>`;
    }
    if (g.paused) {
      return `<div class="bbv-turn-banner"><span>Juego en pausa (subasta o crisis en curso).</span><span class="bbv-timer paused">Pausado</span></div>`;
    }
    if (isMyTurn) {
      const remaining = timeRemainingFor(g);
      const cls = remaining <= 10 ? 'danger' : remaining <= 30 ? 'warn' : '';
      const m = Math.floor(remaining / 60), s = remaining % 60;
      const msg = g.currentTurn.isLastTurn
        ? '¡Último turno de la partida! Solo puedes vender; luego juega tu tarjeta.'
        : '¡Es el turno de tu equipo! Puedes comprar/vender y luego jugar tu tarjeta.';
      return `
        <div class="bbv-turn-banner">
          <span>${msg}</span>
          <span class="bbv-timer ${cls}">${m}:${s.toString().padStart(2, '0')}</span>
        </div>`;
    }
    const turnTeam = g.teams.find(t => t.id === g.currentTurn.teamId);
    return `<div class="bbv-turn-banner not-your-turn"><span>Esperando el turno de ${escapeHtml(turnTeam ? turnTeam.name : '')}…${g.currentTurn.isLastTurn ? ' (último turno de la partida)' : ''}</span></div>`;
  }

  function view_priceDelta(c) {
    const hist = c.priceHistory || [];
    if (hist.length < 2) return '';
    const delta = hist[hist.length - 1] - hist[hist.length - 2];
    const dividendBadge = c.lastPriceEvent === 'dividend' ? `<span class="bbv-dividend-badge">💰 dividendo</span>` : '';
    if (delta === 0) return dividendBadge;
    const isUp = delta > 0;
    const arrow = isUp ? '▲' : '▼';
    const sign = isUp ? '+' : '';
    return `<span class="bbv-price-delta ${isUp ? 'up' : 'down'}">${arrow} ${sign}${delta}</span>${dividendBadge}`;
  }

  function view_market() {
    const g = app.game;
    const team = myTeam();
    const isMyTurn = g.currentTurn.teamId === app.myTeamId && !g.paused && !g.manualPause;
    const rows = g.companies.map(c => {
      const held = team.holdings[c.id] || 0;
      const lockedByBefore = g.currentTurn.phase === 'after' && g.currentTurn.operatedCompanyBefore === c.id && isMyTurn;
      const canBuy = isMyTurn && !lockedByBefore && !g.auction && !g.currentTurn.isLastTurn;
      const canSell = g.auction ? held > 0 : (isMyTurn && !lockedByBefore && held > 0);
      return `
        <div class="bbv-company-card">
          <div class="bbv-ticker-hex" style="background:${c.color || '#888'}">${c.ticker || c.name.slice(0,2).toUpperCase()}</div>
          <div><div class="bbv-co-name">${escapeHtml(c.name)}</div><div class="bbv-co-stats"><span>Tienes: ${held}</span><span>Acc. broker: ${c.brokerShares}</span></div></div>
          <div class="bbv-co-price-wrap">${view_priceDelta(c)}<span class="bbv-co-price">${c.price}</span></div>
          <div class="bbv-co-actions">
            <button class="bbv-btn-buy" data-action="open-trade" data-company="${c.id}" data-side="buy" ${canBuy ? '' : 'disabled'}>Comprar</button>
            <button class="bbv-btn-sell" data-action="open-trade" data-company="${c.id}" data-side="sell" ${canSell ? '' : 'disabled'}>Vender</button>
          </div>
        </div>`;
    }).join('');
    return `<div><p class="bbv-section-title">Mercado</p><div class="bbv-company-list">${rows}</div></div>`;
  }

  function view_cards() {
    const g = app.game;
    const team = myTeam();
    const isMyTurn = g.currentTurn.teamId === app.myTeamId && !g.paused && !g.manualPause;
    const canPlay = isMyTurn && !g.currentTurn.cardPlayed;
    const rows = team.hand.map(card => {
      const info = CARD_INFO[card.cardId];
      const def = CARD_DEFS[card.cardId];
      const company = companyById(card.targetCompanyId);
      const expanded = app.expandedCardInstanceId === card.instanceId;
      return `
        <div class="bbv-play-card ${canPlay ? '' : 'disabled'}">
          <div class="bbv-play-card-head" data-action="toggle-card-desc" data-instance="${card.instanceId}">
            <div class="bbv-card-left">
              <div class="bbv-ticker-hex" style="background:${company.color || '#888'}">${company.ticker || company.name.slice(0,2).toUpperCase()}</div>
              <div><div class="bbv-card-label">${info.label}</div><div class="bbv-card-target">${escapeHtml(company.name)}</div></div>
            </div>
            <button class="bbv-btn-play" data-action="play-card" data-instance="${card.instanceId}" ${canPlay && !app.actionInFlight ? '' : 'disabled'}>Jugar</button>
          </div>
          ${expanded ? `<div class="bbv-card-desc">${info.desc}</div>` : ''}
        </div>`;
    }).join('') || `<p style="font-size:13px;color:var(--ink-soft)">No te quedan tarjetas.</p>`;
    return `<div><p class="bbv-section-title">Tus tarjetas (${team.hand.length})</p><div class="bbv-card-list">${rows}</div></div>`;
  }

  function view_portfolio() {
    const team = myTeam();
    const valued = Object.entries(team.holdings).reduce((sum, [id, qty]) => sum + qty * companyById(id).price, 0);
    return `
      <div class="bbv-portfolio">
        <p class="bbv-section-title" style="margin-bottom:8px;">Tu portafolio</p>
        <div class="bbv-portfolio-row"><span>Acciones valuadas</span><span class="val">${formatBs(valued)}</span></div>
        <div class="bbv-portfolio-row"><span>Efectivo</span><span class="val">${formatBs(team.cash)}</span></div>
        <div class="bbv-portfolio-row"><span>Total</span><span class="val">${formatBs(valued + team.cash)}</span></div>
      </div>`;
  }

  function view_eventLog() {
    const g = app.game;
    const entries = (g.log || []).slice(-10).reverse();
    const rows = entries.length
      ? entries.map(e => `<div class="bbv-log-row"><span class="bbv-log-turn">T${e.turn}</span><span>${escapeHtml(e.text)}</span></div>`).join('')
      : `<p style="font-size:12.5px;color:var(--ink-soft);">Todavía no pasó nada en esta partida.</p>`;
    return `
      <div class="bbv-portfolio">
        <p class="bbv-section-title" style="margin-bottom:8px;">Qué está pasando</p>
        <div class="bbv-log-list">${rows}</div>
      </div>`;
  }

  function view_chart() {
    const g = app.game;
    const w = 560, h = 160, pad = 8;
    const allPrices = g.companies.flatMap(c => c.priceHistory && c.priceHistory.length ? c.priceHistory : [c.price]);
    const min = Math.min(...allPrices), max = Math.max(...allPrices);
    const range = (max - min) || 1;
    const pointsFor = c => {
      const hist = (c.priceHistory && c.priceHistory.length) ? c.priceHistory : [c.price];
      return hist.map((p, i) => {
        const x = hist.length > 1 ? pad + (i / (hist.length - 1)) * (w - pad * 2) : pad;
        const y = h - pad - ((p - min) / range) * (h - pad * 2);
        return `${x},${y}`;
      }).join(' ');
    };
    const legend = g.companies.map(c => `<span><span class="bbv-legend-dot" style="background:${c.color || '#888'}"></span>${c.ticker || c.name}</span>`).join('');
    const lines = g.companies.map(c => `<polyline points="${pointsFor(c)}" fill="none" stroke="${c.color || '#888'}" stroke-width="2" />`).join('');
    return `<div class="bbv-chart-wrap"><p class="bbv-section-title">Ruedo virtual</p><div class="bbv-chart-legend">${legend}</div><svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;display:block;">${lines}</svg></div>`;
  }

  function view_crisisOverlay() {
    const g = app.game;
    const pending = (g.pendingDecisions || []).filter(d => !d.resolved && d.teamId === app.myTeamId);
    if (pending.length === 0) return '';
    const d = pending[0];
    const company = companyById(d.companyId);
    const held = myTeam().holdings[d.companyId] || 0;
    const cost = held * 20;
    return `
      <div class="bbv-modal-backdrop">
        <div class="bbv-modal" onclick="event.stopPropagation()">
          <h3>Crisis en ${escapeHtml(company.name)}</h3>
          <p>El precio tocó el piso (Bs 10). Decide qué hacer con tus ${held} acciones antes de continuar.</p>
          <div class="bbv-modal-actions">
            <button class="bbv-modal-cancel" data-action="crisis-return" data-company="${d.companyId}" ${app.actionInFlight ? 'disabled' : ''}>Devolverlas al broker</button>
            <button class="bbv-modal-confirm" data-action="crisis-keep" data-company="${d.companyId}" ${app.actionInFlight ? 'disabled' : ''}>Conservarlas (Bs ${cost})</button>
          </div>
        </div>
      </div>`;
  }

  function view_auctionBanner() {
    const g = app.game;
    if (!g.auction) return '';
    const a = g.auction;
    const company = companyById(a.companyId);
    const highestBid = a.bids.length ? a.bids[a.bids.length - 1] : null;
    const nextAmount = nextAuctionBidAmount(g);
    const nextTotal = nextAmount * a.lotSize;
    const myContribution = a.contributions[app.myTeamId] || 0;
    const elapsed = Math.floor((Date.now() - (a.auctionStartedAt || Date.now())) / 1000);
    const secondsLeft = Math.max(0, AUCTION_SECONDS - elapsed);

    const contribLines = Object.entries(a.contributions).filter(([, qty]) => qty > 0).map(([teamId, qty]) => {
      const t = g.teams.find(tm => tm.id === teamId);
      return `${escapeHtml(t ? t.name : teamId)}: ${qty} acc.`;
    }).join(' · ') || 'nadie tenía acciones para aportar';

    return `
      <div class="bbv-auction-banner">
        <div class="bbv-auction-head">
          <span class="bbv-auction-badge">🔔 Subasta en vivo</span>
          <h3>${escapeHtml(company.name)}</h3>
          <span class="bbv-timer ${secondsLeft <= 10 ? 'danger' : 'warn'}">${secondsLeft}s</span>
        </div>
        <p>Lote obligatorio de ${a.lotSize} acciones (aportes: ${contribLines}; broker completó ${a.brokerShares}). Al cerrarse, quienes aportaron se liquidan a Bs ${a.priceAtStart}/acción${myContribution ? ` — te tocan Bs ${myContribution * a.priceAtStart}` : ''}.</p>
        <div class="bbv-inline-row">
          <span style="font-size:13px;">Puja actual: <strong>${highestBid ? `Bs ${highestBid.amountPerShare}/acción` : 'ninguna todavía'}</strong></span>
          <button class="bbv-btn-sm" data-action="auction-bid" ${(highestBid && highestBid.teamId === app.myTeamId) || app.actionInFlight ? 'disabled' : ''}>Pujar Bs ${nextAmount} (lote: ${formatBs(nextTotal)})</button>
        </div>
        <p class="bbv-hint">La subasta se cierra sola cuando llega a 0s — se adjudica al mejor postor en ese momento que aún pueda pagar el lote.${highestBid && highestBid.teamId === app.myTeamId ? ' Tienes la puja más alta: espera a que otro equipo supere tu oferta.' : ''}</p>
        <p class="bbv-hint">¿Necesitas efectivo para pujar? Usa el botón "Vender" de cualquier empresa en el Mercado — funciona aunque no sea tu turno mientras dure la subasta. Ojo: si vendes después de pujar y ya no te alcanza para pagar el lote, tu puja queda descalificada.</p>
      </div>`;
  }

  function view_modal() {
    // Prioridad: crisis (obligatoria) > modal normal de comprar/vender. La subasta ya no bloquea la pantalla.
    const g = app.game;
    const crisisHtml = view_crisisOverlay();
    if (crisisHtml) return crisisHtml;

    if (!app.modal) return '';
    if (app.modal.type === 'rules') {
      return `
        <div class="bbv-modal-backdrop" data-action="close-modal">
          <div class="bbv-modal" style="max-width:520px;max-height:80vh;overflow-y:auto;" onclick="event.stopPropagation()">
            <h3>Cómo se juega</h3>
            ${guideSectionsHtml()}
            <button class="bbv-modal-confirm" data-action="close-modal" style="margin-top:10px;">Cerrar</button>
          </div>
        </div>`;
    }
    if (app.modal.type === 'trade') {
      const company = companyById(app.modal.companyId);
      const team = myTeam();
      const maxQty = app.modal.side === 'buy'
        ? Math.min(company.brokerShares, Math.floor(team.cash / company.price))
        : (team.holdings[company.id] || 0);
      return `
        <div class="bbv-modal-backdrop" data-action="close-modal">
          <div class="bbv-modal" onclick="event.stopPropagation()">
            <h3>${app.modal.side === 'buy' ? 'Comprar' : 'Vender'} ${escapeHtml(company.name)}</h3>
            <p>Precio actual: ${company.price} · Máximo: ${maxQty}</p>
            <input type="number" id="bbv-trade-qty" min="1" max="${maxQty}" value="1" oninput="document.getElementById('bbv-trade-total').textContent = 'Bs ' + ((parseInt(this.value,10)||0) * ${company.price}).toLocaleString('es-BO')">
            <div class="bbv-portfolio-row" style="border:none;padding:0 0 14px 0;"><span>Total a ${app.modal.side === 'buy' ? 'pagar' : 'recibir'}</span><span class="val" id="bbv-trade-total">Bs ${company.price.toLocaleString('es-BO')}</span></div>
            <div class="bbv-modal-actions">
              <button class="bbv-modal-cancel" data-action="close-modal">Cancelar</button>
              <button class="bbv-modal-confirm" data-action="confirm-trade" ${app.actionInFlight ? 'disabled' : ''}>Confirmar</button>
            </div>
          </div>
        </div>`;
    }
    if (app.modal.type === 'other-company') {
      const target = companyById(app.modal.targetCompanyId);
      const options = g.companies.filter(c => c.id !== target.id).map(c => `<option value="${c.id}" ${c.id === app.modal.otherCompanyId ? 'selected' : ''}>${escapeHtml(c.name)}</option>`).join('');
      return `
        <div class="bbv-modal-backdrop" data-action="close-modal">
          <div class="bbv-modal" onclick="event.stopPropagation()">
            <h3>Elige la otra empresa</h3>
            <p>Esta tarjeta también afecta a otra empresa distinta de ${escapeHtml(target.name)}.</p>
            <select id="bbv-other-company" onchange="window.__bbvSetOtherCompany(this.value)">${options}</select>
            <div class="bbv-modal-actions">
              <button class="bbv-modal-cancel" data-action="close-modal">Cancelar</button>
              <button class="bbv-modal-confirm" data-action="confirm-play-card" ${app.actionInFlight ? 'disabled' : ''}>Confirmar</button>
            </div>
          </div>
        </div>`;
    }
    return '';
  }

  function view_leaderboardRows(ranking) {
    const medals = ['🥇', '🥈', '🥉'];
    return `<div class="bbv-company-list">${ranking.map((t, i) => `
      <div class="bbv-company-card" style="${i === 0 ? 'border-color:var(--brass);border-width:2px;' : ''}">
        <div class="bbv-ticker-hex" style="background:${i < 3 ? 'var(--brass)' : '#888'};font-size:16px;">${medals[i] || (i + 1)}</div>
        <div><div class="bbv-co-name">${escapeHtml(t.name)}${t.eliminated ? ' <span style="color:var(--down);font-size:11px;">(eliminado)</span>' : ''}</div><div class="bbv-co-stats"><span>Puesto ${i + 1}</span></div></div>
        <div class="bbv-co-price">${formatBs(t.cash)}</div>
      </div>`).join('')}</div>`;
  }

  function view_gameOverBlock() {
    const g = app.game;
    const ranking = [...g.teams].sort((a, b) => b.cash - a.cash);
    const myRank = ranking.findIndex(t => t.id === app.myTeamId) + 1;
    return `
      <div class="bbv-content">
        <div class="bbv-card" style="max-width:480px;">
          <p class="bbv-eyebrow">Partida terminada</p>
          <h1 class="bbv-title">🏆 ${escapeHtml(ranking[0].name)}</h1>
          <p class="bbv-sub">Gana con ${formatBs(ranking[0].cash)}. ${myRank ? `Tu equipo terminó en el puesto ${myRank} de ${ranking.length}.` : ''}</p>
          ${view_leaderboardRows(ranking)}
        </div>
      </div>`;
  }

  function view_game() {
    const g = app.game;
    if (g.gameOver) return view_gameOverBlock();
    const isMyTurn = g.currentTurn.teamId === app.myTeamId && !g.paused && !g.manualPause;
    const canEndTurn = isMyTurn && !!g.currentTurn.cardPlayed;
    return `
      ${view_turnBanner()}
      ${view_auctionBanner()}
      <div class="bbv-error" style="padding:0 20px;">${app.error}</div>
      <div class="bbv-main">
        <div>${view_market()}${view_chart()}</div>
        <div>${view_cards()}${view_portfolio()}${view_eventLog()}</div>
      </div>
      ${canEndTurn ? `<div class="bbv-footer-turn"><button class="bbv-btn-sm" data-action="end-turn" ${app.actionInFlight ? 'disabled' : ''}>Terminar mi turno</button></div>` : ''}
      ${view_modal()}
    `;
  }

  // ================= RENDER PRINCIPAL =================
  function render() {
    root.setAttribute('data-theme', app.theme);
    let inner = '';
    if (app.screen === 'role-select') inner = view_roleSelect();
    else if (app.screen === 'broker-setup') inner = view_brokerSetup();
    else if (app.screen === 'broker-waiting') inner = view_brokerWaiting();
    else if (app.screen === 'team-join') inner = view_teamJoin();
    else if (app.screen === 'team-waiting') inner = view_teamWaiting();
    else if (app.screen === 'team-guide') inner = view_teamGuide();
    else if (app.screen === 'broker-started') inner = `<div class="bbv-card"><p class="bbv-sub">Cargando la partida…</p></div>`;

    if (app.screen === 'game' && app.game) {
      root.innerHTML = `
        <div class="bbv-topbar"><span class="bbv-topbar-title">Juego de la Bolsa</span><div style="display:flex;gap:8px;"><button class="bbv-theme-toggle" data-action="open-rules">Reglas</button><button class="bbv-theme-toggle" data-action="toggle-theme">${app.theme === 'light' ? 'Modo oscuro' : 'Modo claro'}</button></div></div>
        ${view_game()}
      `;
    } else if (app.screen === 'broker-started' && app.game) {
      root.innerHTML = `
        <div class="bbv-topbar"><span class="bbv-topbar-title">Juego de la Bolsa · Sala ${app.roomCode}</span><button class="bbv-theme-toggle" data-action="toggle-theme">${app.theme === 'light' ? 'Modo oscuro' : 'Modo claro'}</button></div>
        ${view_brokerStarted()}
      `;
    } else {
      root.innerHTML = `
        <div class="bbv-topbar"><span class="bbv-topbar-title">Juego de la Bolsa</span><button class="bbv-theme-toggle" data-action="toggle-theme">${app.theme === 'light' ? 'Modo oscuro' : 'Modo claro'}</button></div>
        <div class="bbv-content">${inner}</div>
      `;
    }
    bindEvents();
  }

  function bindEvents() {
    root.querySelectorAll('[data-action]').forEach(el => el.addEventListener('click', onAction));
  }

  function onAction(e) {
    const action = e.currentTarget.getAttribute('data-action');
    if (action === 'toggle-theme') {
      if (app.screen === 'broker-setup') captureSetupDraft();
      app.theme = app.theme === 'light' ? 'dark' : 'light';
      render();
    }
    else if (action === 'go-broker') setScreen('broker-setup');
    else if (action === 'go-team') setScreen('team-join');
    else if (action === 'back-to-role') { stopTimers(); app = { ...app, screen: 'role-select', error: '', roomCode: null, myTeamId: null, room: null, game: null }; render(); }
    else if (action === 'open-rules') { app.modal = { type: 'rules' }; render(); }
    else if (action === 'show-guide') { app.screen = 'team-guide'; render(); }
    else if (action === 'guide-continue') {
      if (app.room && app.room.started) { loadGameAndSwitch('game'); }
      else { app.screen = 'team-waiting'; render(); }
    }
    else if (action === 'select-turn-seconds') {
      captureSetupDraft(); // conserva lo ya escrito antes de redibujar
      app.selectedTurnSeconds = parseInt(e.currentTarget.value, 10);
      render();
    }
    else if (action === 'create-room') {
      captureSetupDraft(); // si hay un error de validación, el redibujado no borra los campos
      const enabledCardIds = Object.keys(CARD_INFO).filter(id => document.getElementById('bbv-card-' + id).checked);
      createRoom(document.getElementById('bbv-max-teams').value, document.getElementById('bbv-hand-size').value, enabledCardIds, app.selectedTurnSeconds ?? DEFAULT_TURN_SECONDS);
    }
    else if (action === 'join-room') joinRoom(document.getElementById('bbv-room-code').value, document.getElementById('bbv-team-name').value);
    else if (action === 'start-game') startGame();
    else if (action === 'open-trade') { app.modal = { type: 'trade', companyId: e.currentTarget.getAttribute('data-company'), side: e.currentTarget.getAttribute('data-side') }; render(); }
    else if (action === 'close-modal') { app.modal = null; render(); }
    else if (action === 'confirm-trade') {
      const qty = parseInt(document.getElementById('bbv-trade-qty').value, 10);
      if (qty > 0) runAction(() => doTrade(app.modal.companyId, app.modal.side, qty));
      else { app.modal = null; render(); }
    }
    else if (action === 'toggle-card-desc') {
      const id = e.currentTarget.getAttribute('data-instance');
      app.expandedCardInstanceId = app.expandedCardInstanceId === id ? null : id;
      render();
    }
    else if (action === 'play-card') {
      e.stopPropagation();
      const instanceId = e.currentTarget.getAttribute('data-instance');
      const card = myTeam().hand.find(c => c.instanceId === instanceId);
      const def = CARD_DEFS[card.cardId];
      if (def.needsOtherCompany) {
        const firstOtherCompany = myTeamAvailableOtherCompany(card.targetCompanyId);
        app.modal = { type: 'other-company', instanceId, targetCompanyId: card.targetCompanyId, otherCompanyId: firstOtherCompany };
        render();
      }
      else runAction(() => doPlayCard(instanceId, null));
    }
    else if (action === 'confirm-play-card') {
      const otherCompanyId = app.modal.otherCompanyId;
      runAction(() => doPlayCard(app.modal.instanceId, otherCompanyId));
    }
    else if (action === 'end-turn') runAction(() => doEndTurn());
    else if (action === 'crisis-keep') runAction(() => doCrisisDecision(e.currentTarget.getAttribute('data-company'), 'keep'));
    else if (action === 'crisis-return') runAction(() => doCrisisDecision(e.currentTarget.getAttribute('data-company'), 'return'));
    else if (action === 'auction-bid') runAction(() => doAuctionBid());
    else if (action === 'auction-resolve') runAction(() => doAuctionResolve());
    else if (action === 'toggle-pause') runAction(() => doTogglePause());
    else if (action === 'skip-turn') runAction(() => doSkipTurn());
  }

  render();
})();
</script>
